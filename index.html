<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>R Analytics Studio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1e1e1e;color:#ccc;font:13px -apple-system,Segoe UI,sans-serif}
#app{display:grid;height:100%;grid-template-rows:42px 1fr;grid-template-columns:190px 1fr 280px}
header{grid-column:1/4;display:flex;gap:6px;align-items:center;padding:0 10px;background:#333;border-bottom:1px solid #111;overflow-x:auto}
header b{color:#75b6ff;margin-right:8px;white-space:nowrap}
button{background:#3c3c3c;color:#ddd;border:1px solid #555;border-radius:4px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
button:hover{background:#4a4a4a}.run{background:#2e7d32;border-color:#2e7d32;color:#fff}.ai{background:#5b3fa8;border-color:#5b3fa8;color:#fff}
aside{background:#252526;overflow:auto;padding:8px}aside h4{margin:4px 0 8px;font-size:11px;letter-spacing:1px;color:#999;display:flex;justify-content:space-between;align-items:center}
.f{padding:6px 8px;border-radius:4px;cursor:pointer}.f:hover,.f.on{background:#37373d}
main{display:grid;grid-template-rows:1fr 220px;min-width:0}#editor{min-height:0}
#bottom{background:#1e1e1e;border-top:1px solid #333;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;background:#252526}.tabs div{padding:6px 14px;cursor:pointer;color:#999}.tabs .on{color:#fff;border-bottom:2px solid #75b6ff}
.pane{flex:1;overflow:auto;padding:8px;font:12px ui-monospace,Menlo,monospace;white-space:pre-wrap;display:none}.pane.on{display:block}
.err{color:#f48771}#plots img{max-width:100%;background:#fff;margin:0 8px 8px 0;border-radius:4px}
textarea{width:100%;height:90px;background:#1e1e1e;color:#ddd;border:1px solid #555;border-radius:4px;padding:6px;font:13px inherit}
#aiout{margin-top:10px;white-space:pre-wrap;line-height:1.5}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:42px 120px minmax(300px,1fr) auto}header{grid-column:1}aside{max-height:none}main{grid-template-rows:340px 220px}}
</style></head><body><div id="app">
<header><b>R&nbsp;Analytics&nbsp;Studio</b>
<button class="run" onclick="run()">▶ Run</button><button onclick="save()">Save</button>
<button class="ai" onclick="ai('generate')">✨ AI Generate</button><button class="ai" onclick="ai('fix')">🔧 AI Fix</button><button class="ai" onclick="ai('explain')">💡 AI Explain</button>
<button onclick="$('#up').click()">Upload CSV</button><button onclick="download()">Download .R</button>
<input id="up" type="file" accept=".csv,.tsv,.txt" hidden></header>
<aside><h4>EXPLORER <button onclick="newFile()">+</button></h4><div id="files"></div></aside>
<main><div id="editor"></div><div id="bottom"><div class="tabs"><div id="t-console" class="on" onclick="tab('console')">Console</div><div id="t-plots" onclick="tab('plots')">Plots</div></div>
<div id="console" class="pane on">Press ▶ Run (or Ctrl/Cmd+Enter).</div><div id="plots" class="pane"></div></div></main>
<aside><h4>AI ASSISTANT</h4><textarea id="prompt" placeholder="Describe what you want, e.g. 'histogram of mpg with a density line'"></textarea>
<div id="aiout">Generate inserts code at your cursor. Fix repairs the whole script using the last error. Explain describes your selection (or all code).</div></aside>
</div>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
const $=s=>document.querySelector(s);let editor,lastError='',cur='script.R';
const base='https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min';
const api=async(u,b)=>{const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j};
window.MonacoEnvironment={getWorkerUrl:()=>URL.createObjectURL(new Blob([`self.MonacoEnvironment={baseUrl:'${base}/'};importScripts('${base}/vs/base/worker/workerMain.js');`],{type:'text/javascript'}))};
require.config({paths:{vs:base+'/vs'}});
require(['vs/editor/editor.main'],async()=>{
  editor=monaco.editor.create($('#editor'),{value:'',language:'r',theme:'vs-dark',automaticLayout:true,fontSize:14,minimap:{enabled:false}});
  editor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.Enter,run);
  editor.addCommand(monaco.KeyMod.CtrlCmd|monaco.KeyCode.KeyS,save);
  await loadFiles();openFile('script.R');});
async function loadFiles(){const fs=await api('/api/files');const d=$('#files');d.textContent='';
  fs.forEach(n=>{const e=document.createElement('div');e.className='f'+(n===cur?' on':'');e.textContent=(/\.r$/i.test(n)?'📄 ':'📊 ')+n;e.onclick=()=>openFile(n);d.appendChild(e)})}
async function openFile(n){if(/\.r$/i.test(n)){const j=await api('/api/file?name='+encodeURIComponent(n));cur=n;editor.setValue(j.content);loadFiles()}
  else{const p=editor.getPosition();editor.executeEdits('f',[{range:new monaco.Range(p.lineNumber,1,p.lineNumber,1),text:`df <- read.csv("${n}")\nhead(df)\nstr(df)\n`}]);}}
function newFile(){let n=prompt('New script name','analysis.R');if(!n)return;if(!/\.r$/i.test(n))n+='.R';cur=n;editor.setValue('# '+n+'\n');save()}
async function save(){await api('/api/files',{name:cur,content:editor.getValue()});loadFiles();out('Saved '+cur)}
function download(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([editor.getValue()],{type:'text/plain'}));a.download=cur;a.click()}
$('#up').onchange=async e=>{const f=e.target.files[0];if(!f)return;await api('/api/files',{name:f.name,content:await f.text()});await loadFiles();out('Uploaded '+f.name+'. Click it in the explorer to insert code that loads it.');e.target.value=''};
function tab(t){['console','plots'].forEach(x=>{$('#'+x).classList.toggle('on',x===t);$('#t-'+x).classList.toggle('on',x===t)})}
function add(t,c){const s=document.createElement('span');s.className=c;s.textContent=t+'\n';$('#console').appendChild(s)}
async function run(){const c=$('#console');c.textContent='Running…\n';tab('console');
  try{const j=await api('/api/run',{code:editor.getValue()});c.textContent='';
    if(j.stdout)add(j.stdout,'');if(j.stderr)add(j.stderr,'err');if(j.error)add('['+j.error+']','err');
    lastError=(j.stderr||'')+(j.error||'');const p=$('#plots');p.textContent='';
    j.plots.forEach(b=>{const i=new Image();i.src='data:image/png;base64,'+b;p.appendChild(i)});
    if(j.plots.length)tab('plots')}catch(e){c.textContent='';add(e.message,'err')}}
const out=t=>$('#aiout').textContent=t;
async function ai(mode){const prompt=$('#prompt').value.trim();if(mode==='generate'&&!prompt)return out('Type what you want in the box above first.');
  const sel=editor.getModel().getValueInRange(editor.getSelection());out('Thinking…');
  try{const {text}=await api('/api/ai',{mode,prompt,code:mode==='explain'&&sel?sel:editor.getValue(),error:lastError});
    const m=text.match(/```(?:r|R)?\n([\s\S]*?)```/);
    if(mode!=='explain'&&m){const code=m[1].trim()+'\n';
      if(mode==='fix')editor.executeEdits('ai',[{range:editor.getModel().getFullModelRange(),text:code}]);
      else{const p=editor.getPosition();editor.executeEdits('ai',[{range:new monaco.Range(p.lineNumber,1,p.lineNumber,1),text:code+'\n'}])}
      out((text.replace(m[0],'').trim()||'Done.')+'\n\n(Applied to editor — Ctrl/Cmd+Z to undo.)')}
    else out(text)}catch(e){out('Error: '+e.message)}}
</script></body></html>
